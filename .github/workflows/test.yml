name: tests
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh wamerican fzf util-linux
      - name: shellcheck installer
        if: runner.os == 'Linux'
        run: shellcheck site/install.sh
      - name: run suite
        run: python3 tests/run_tests.py
      - name: e2e picker in a pty (linux)
        if: runner.os == 'Linux'
        run: bash tests/e2e_pty.sh
      - name: installer smoke (linux)
        if: runner.os == 'Linux'
        run: |
          export HOME=$(mktemp -d)
          bash site/install.sh
          test -f "$HOME/.claude/portal/rank.py"
          python3 "$HOME/.claude/portal/rank.py" --selftest
